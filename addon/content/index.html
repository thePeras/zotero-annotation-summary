<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title"></title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon@0.5x.png"
    />
    <link rel="stylesheet" href="styles/index.css" />
  </head>
  <body>
      <!-- First Row: Search fields and right-aligned dropdowns -->
      <div class="controls-row-1">
        <div class="controls-left">
          <div class="control-group">
            <label for="text-search" id="label-text-search"></label>
            <input type="text" id="text-search" placeholder="" />
          </div>
          <div class="control-group">
            <label for="comment-search" id="label-comment-search"></label>
            <input type="text" id="comment-search" placeholder="" />
          </div>
        </div>
        
        <div class="controls-right">
          <div class="control-group">
            <label for="date-preset" id="label-date-preset"></label>
            <select id="date-preset">
              <option value="all" id="date-preset-all"></option>
              <option value="1" id="date-preset-1"></option>
              <option value="3" id="date-preset-3"></option>
              <option value="7" id="date-preset-7"></option>
              <option value="30" id="date-preset-30"></option>
              <option value="365" id="date-preset-365"></option>
            </select>
          </div>
          
          <div class="control-group">
            <label id="label-collection-filter"></label>
            <div class="collections-dropdown">
              <button id="collections-trigger" class="collections-trigger"></button>
              <div id="collections-panel" class="collections-panel">
                <div id="collections-tree" class="collections-tree"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Second Row: Filter by label, color/tag filters, and right-aligned controls -->
      <div class="controls-row-2">
        <div class="controls-left">
          <span class="filter-by-label" id="label-filter-by">Filter by:</span>
          
          <div class="colors-list" id="colors-list"></div>
          
          <div class="tags-list" id="tags-list"></div>
        </div>
        
        <div class="controls-right">
          <div class="control-group">
            <label for="items-per-row" id="label-items-per-row"></label>
            <div class="layout-toggle" id="items-per-row">
              <button class="layout-btn active" data-layout="1">1</button>
              <button class="layout-btn" data-layout="2">2</button>
              <button class="layout-btn" data-layout="3">3</button>
            </div>
          </div>

          <div class="control-group">
            <label for="items-per-page" id="label-items-per-page"></label>
            <select id="items-per-page" class="items-per-page-select">
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </div>
        </div>
      </div>

      <div id="annotation-container"></div>
      <!-- 批量添加标签 UI -->
      <div
        id="batch-add-tag-bar"
        style="margin: 12px 0 0 0; display: flex; align-items: center; gap: 8px"
      >
        <div style="position: relative; flex: 1">
          <input
            id="batch-tag-input"
            type="text"
            placeholder="输入标签"
            style="
              width: 100%;
              padding: 6px 8px;
              border-radius: 4px;
              border: 1px solid #ddd;
              font-size: 0.9rem;
            "
            autocomplete="off"
          />
          <div
            id="batch-tag-suggestions"
            style="
              position: absolute;
              left: 0;
              right: 0;
              top: 100%;
              background: #fff;
              border: 1px solid #ddd;
              border-radius: 0 0 4px 4px;
              box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
              z-index: 10;
              display: none;
            "
          ></div>
        </div>
        <button
          id="batch-add-tag-btn"
          style="
            padding: 6px 12px;
            border-radius: 4px;
            background: #5680c3;
            color: #fff;
            border: none;
            font-weight: 500;
            cursor: pointer;
            font-size: 0.9rem;
          "
        >
          添加标签
        </button>
      </div>
      <div id="display-count"></div>

      <!-- 分页导航 -->
      <div id="pagination-container">
        <button id="prev-page"></button>
        <span id="page-info"></span>
        <button id="next-page"></button>
      </div>

      <div id="no-results" style="display: none"></div>

      <!-- 统计区域 - 移到顶部，移除容器 -->
      <div class="stats-grid">
        <div class="stats-box">
          <h3 id="stats-color"></h3>
          <div id="color-histogram"></div>
        </div>
        <div class="stats-box">
          <h3 id="stats-tag"></h3>
          <div id="tag-histogram"></div>
        </div>
      </div>

    <script src="scripts/summary-ui.js"></script>
  </body>
</html>
